[project]
name = "stampd-admin"
version = "0.1.0"
description = "Stampd admin service — business logic and user management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
]

# Transit — cross-language interop (https://github.com/SabeeirSharrma/transit)
# Python runtime is imported from node_modules/transit at runtime.
# See transit_service.py for the Transit server setup.

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
