[workspace]
resolver = "2"
members = [
    "stampd-engine",
    "stampd-cli",
    "stampd-engine-bridge",
]
exclude = [
    "test-transit/rust",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sabeeir/stampd"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
trust-dns-resolver = "0.23"
ring = "0.17"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
argon2 = "0.5"
getrandom = "0.2"
